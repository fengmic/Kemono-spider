name: Release

# 触发：push v* tag（版本号取自 tag）；workflow_dispatch 手动触发
# 手动触发留空 version 时，在仓库最新 vX.Y.Z tag 的次版本上 +1（3.0.0 -> 3.1.0）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 3.1.0；留空 = 最新 tag 次版本 +1'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: KemonoDownloader
  CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # 1. 版本解析
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numeric: ${{ steps.ver.outputs.numeric }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout (tags needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver=""
          if [ "$EVENT_NAME" = "push" ]; then
            ver="${REF_NAME#v}"
          else
            ver="${INPUT_VERSION#v}"
          fi

          if [ -z "$ver" ]; then
            git fetch --tags --force --quiet
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
            echo "latest tag: ${latest:-<none>}"
            if [[ "$latest" =~ ^v?([0-9]+)\.([0-9]+)\.[0-9]+ ]]; then
              # 次版本 +1，补丁位归零：3.0.0 -> 3.1.0
              ver="${BASH_REMATCH[1]}.$(( BASH_REMATCH[2] + 1 )).0"
            elif [[ "$latest" =~ ^v?([0-9]+)$ ]]; then
              ver="$(( BASH_REMATCH[1] + 1 )).0.0"
            else
              ver="1.0.0"
            fi
          fi

          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无法解析版本号 '$ver'；请填写形如 3.1.0 的 version，或推送 vX.Y.Z tag"
            exit 1
          fi

          tag="v$ver"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag 已存在；请手动触发时填写更高的 version"
            exit 1
          fi

          # AssemblyVersion/FileVersion 只接受数字段，预发布后缀要剥掉
          numeric="${ver%%[-+]*}"
          pre=false
          case "$ver" in *-*) pre=true ;; esac

          echo "resolved version=$ver numeric=$numeric tag=$tag prerelease=$pre"
          {
            echo "version=$ver"
            echo "numeric=$numeric"
            echo "tag=$tag"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. 打包。WPF/WinForms 只能在 Windows 上发布，且必须显式指定 -r win-x64
  # ---------------------------------------------------------------------------
  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # WPF/WinForms 只支持 Windows RID。若将来出现跨平台入口（控制台/ASP.NET），
        # 在此追加 linux-x64 / osx-arm64，并把 runs-on 改成按 rid 的表达式。
        rid:
          - win-x64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC_VERSION: ${{ needs.version.outputs.numeric }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          # global.json 锁定 10.0.400 + latestPatch；若锁的是预览版 SDK，
          # 追加 dotnet-quality: preview
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Resolve app project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exclude = '[\\/](bin|obj|\.git|\.github|tests?|node_modules)[\\/]'
          $files = @(Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
            Where-Object { $_.FullName -notmatch $exclude })
          if ($files.Count -eq 0) { throw '仓库里没有找到 .csproj' }

          $candidates = @($files | ForEach-Object {
              $text = Get-Content -LiteralPath $_.FullName -Raw
              $isTest = ($text -match 'Microsoft\.NET\.Test\.Sdk') -or ($_.Name -match '(?i)test')
              if ($isTest) { return }
              [pscustomobject]@{
                Rel       = (Resolve-Path -Relative -Path $_.FullName) -replace '\\', '/'
                Text      = $text
                IsDesktop = ($text -match '<UseWPF>\s*true') -or ($text -match '<UseWindowsForms>\s*true') -or ($text -match '<OutputType>\s*WinExe')
                IsExe     = ($text -match '<OutputType>\s*(Win)?Exe')
                IsMulti   = ($text -match '<TargetFrameworks>')
              }
            })
          if ($candidates.Count -eq 0) { throw '所有 .csproj 都像测试工程，找不到可发布的入口' }

          # 桌面可执行 > 可执行 > 其它；同级优先 src/ 下，再按路径排序保证可复现
          $app = $candidates | Sort-Object -Property @(
              @{ Expression = { if ($_.IsDesktop) { 0 } elseif ($_.IsExe) { 1 } else { 2 } } },
              @{ Expression = { if ($_.Rel -match '(?i)^\.?/?src/') { 0 } else { 1 } } },
              @{ Expression = { $_.Rel } }
            ) | Select-Object -First 1

          if (-not $app.IsDesktop -and -not $app.IsExe) {
            throw "选中的 '$($app.Rel)' 是类库，不是应用入口"
          }
          Write-Host "project: $($app.Rel) (desktop=$($app.IsDesktop) exe=$($app.IsExe) multi=$($app.IsMulti))"

          # 多目标工程必须用 --framework 收敛到 Windows TFM，否则 publish 会报错
          $tfm = ''
          if ($app.IsMulti) {
            $m = [regex]::Match($app.Text, '(?s)<TargetFrameworks>\s*([^<]+)</TargetFrameworks>')
            if ($m.Success) {
              $tfm = ($m.Groups[1].Value -split ';' |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -match 'windows' } |
                Select-Object -First 1)
            }
            if (-not $tfm) { throw "多目标工程 '$($app.Rel)' 里没有 Windows TFM，无法用 win-x64 发布" }
          }

          "PROJECT_PATH=$($app.Rel)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($tfm) { "TARGET_FRAMEWORK=$tfm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: dotnet publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'publish'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }

          $dotnetArgs = @(
            'publish', $env:PROJECT_PATH,
            '--configuration', $env:CONFIGURATION,
            '--runtime', '${{ matrix.rid }}',
            '--self-contained', 'true',
            '--output', $out,
            "-p:Version=$env:VERSION",
            "-p:FileVersion=$env:NUMERIC_VERSION",
            "-p:AssemblyVersion=$env:NUMERIC_VERSION",
            "-p:InformationalVersion=$env:VERSION",
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=none',
            '-p:DebugSymbols=false',
            '-p:ContinuousIntegrationBuild=true'
          )
          if ($env:TARGET_FRAMEWORK) { $dotnetArgs += @('--framework', $env:TARGET_FRAMEWORK) }

          Write-Host "dotnet $($dotnetArgs -join ' ')"
          dotnet @dotnetArgs
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败，退出码 $LASTEXITCODE" }

          $exe = Get-ChildItem -Path $out -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "publish 输出里没有 .exe：$out" }
          "PUBLISH_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "built: $($exe.Name)"

      - name: Package zip (version + platform in name)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "$env:APP_NAME-$env:VERSION-${{ matrix.rid }}"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 2)
          Write-Host "asset: $name.zip  ${mb}MB  sha256=$hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. 建 Release 并上传产物（手动触发时该 action 会按 target_commitish 创建 tag）
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          ls -lh
          files="$(ls -1 | grep -v '^SHA256SUMS.txt$' || true)"
          if [ -z "$files" ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
